name: Package Assimp

on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: ["opened", "synchronize"]
    paths:
      - '.github/workflows/package.yml'
      - '.github/workflows/sample.yml'
      - 'external/assimp'
      - 'external/assimp/**'
      - 'sample/**'
  workflow_dispatch:

env:
  ASSIMP_VERSION: '6.0.5'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
      sample: ${{ steps.filter.outputs.sample }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sample:
              - '.github/workflows/package.yml'
              - 'sample/**'
 
  sample:
    if: github.event_name == 'pull_request' && needs.changes.outputs.sample == 'true'
    needs: [changes]
    name: Build sample
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: net10.0-android
            os: windows-latest
            runtime: android-arm64
          - target: net10.0-ios
            os: macos-26
            runtime: iossimulator-arm64
          - target: net10.0-maccatalyst
            os: macos-26
            runtime: maccatalyst-arm64
          - target: net10.0-windows10.0.19041.0
            os: windows-latest
            runtime: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          
      - name: Setup Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        if: ${{ runner.os == 'macOS' }}
        with:
          xcode-version: '26.3'
          
      - name: Setup Java    
        uses: actions/setup-java@v5
        if: ${{ runner.os == 'Windows' }}
        with:
          distribution: 'microsoft'
          java-version: '17'
          
      - name: Build 
        working-directory: ${{ github.workspace }}/sample/Assimp.MAUI.Sample/
        run: dotnet build -c Release -f ${{  matrix.target }} -r ${{ matrix.runtime }}