name: Package Assimp

on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: ["opened", "synchronize"]
    paths:
      - '.github/workflows/package.yml'
      - 'external/assimp'
      - 'external/assimp/**'
      - 'sample/**'
  workflow_dispatch:

env:
  ASSIMP_VERSION: '6.0.6'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - '.github/workflows/package.yml'
              - 'external/assimp'
              - 'external/assimp/**'
              - 'scripts/**'
              - 'swig/**'
              - 'src/Assimp.Maui/Assimp.Maui.csproj'

  android:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    needs: [changes]
    name: Android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            arch_name: arm
          - abi: arm64-v8a
            arch_name: arm64
          - abi: x86
            arch_name: x86
          - abi: x86_64
            arch_name: x64

    steps:
        
      - name: Cache Assimp Submodule
        uses: actions/cache@v5
        id: cache
        with:
          path: |
            artifacts/android/${{ matrix.abi }}/
            assimp-csharp-android-${{ matrix.abi }}-bindings.zip
          key: ${{ runner.os }}-assimp-${{ github.ref_name }}-${{ env.ASSIMP_VERSION }}
                  
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zip

      - name: Install supported SWIG
        uses: mmomtchev/setup-swig@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          version: v4.3.0

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          # r26b is retained for compatibility with the existing build.
          # Explicit linker flags below force 16 KiB ELF LOAD segment alignment.
          ndk-version: r26b
          link-to-sdk: true

      - name: Build Android native library and C# bindings
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/assimp-android.sh --ci -${{ matrix.arch_name }}

      - name: Compress Generated C# Classes
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd src/Assimp.Maui/Platforms/Android/Maui
          zip -r "$GITHUB_WORKSPACE/assimp-csharp-android-${{ matrix.abi }}-bindings.zip" . -x "assimpmaui.cxx"

      - name: Prepare Android Artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p artifacts/android/${{ matrix.abi }}
          cp build/android-${{ matrix.abi }}/bin/libassimp.so artifacts/android/${{ matrix.abi }}/
          cp build/android-${{ matrix.abi }}/bin/libassimpmaui.so artifacts/android/${{ matrix.abi }}/

          case "${{ matrix.abi }}" in
            "armeabi-v7a")
              NDK_LIBCXX_ABI="arm-linux-androideabi"
              ;;
            "arm64-v8a")
              NDK_LIBCXX_ABI="aarch64-linux-android"
              ;;
            "x86")
              NDK_LIBCXX_ABI="i686-linux-android"
              ;;
            "x86_64")
              NDK_LIBCXX_ABI="x86_64-linux-android"
              ;;
          esac

          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${NDK_LIBCXX_ABI}/libc++_shared.so" \
            artifacts/android/${{ matrix.abi }}/libc++_shared.so

      - name: Upload Native Binaries (.so)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-android-${{ matrix.abi }}
          path: artifacts/android/${{ matrix.abi }}/*

      - name: Upload C# Bindings Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-csharp-android-${{ matrix.abi }}-bindings
          path: assimp-csharp-android-${{ matrix.abi }}-bindings.zip

  ios:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    needs: [changes]
    name: iOS
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: device
            sdk: iphoneos
            arch: arm64
            min_version: "15.0"
          - target: simulator
            sdk: iphonesimulator
            arch: arm64
            min_version: "15.0"

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Assimp Submodule
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            assimp-csharp-ios-${{ matrix.sdk }}-${{ matrix.arch }}-bindings.zip
            artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}/
          key: ${{ runner.os }}-assimp-${{ github.ref_name }}-${{ env.ASSIMP_VERSION }}

      - name: Install SWIG and Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install cmake

      - name: Install supported SWIG
        uses: mmomtchev/setup-swig@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          version: v4.3.0

      - name: Build iOS native library and C# bindings
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ matrix.sdk }}" = "iphoneos" ]; then
            bash scripts/assimp-ios.sh --ci -arm64
          else
            bash scripts/assimp-ios.sh --ci -arm64s
          fi

      - name: Compress Generated C# Classes
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd src/Assimp.Maui/Platforms/iOS/Maui
          zip -r "$GITHUB_WORKSPACE/assimp-csharp-ios-${{ matrix.sdk }}-${{ matrix.arch }}-bindings.zip" . -x "assimpmaui.cxx" "assimpmaui.o"

      - name: Prepare iOS Artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}
          if [ "${{ matrix.sdk }}" = "iphoneos" ]; then
            BUILD_NAME="ios-arm64"
          else
            BUILD_NAME="ios-simulator-arm64"
          fi
          cp "build/$BUILD_NAME/lib/libassimp.a" artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}/
          cp "build/$BUILD_NAME/lib/libassimpmaui.a" artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}/
          libtool -static -o artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}/libassimp.a \
            artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}/libassimp.a \
            artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}/libassimpmaui.a
          rm -f artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}/libassimpmaui.a

      - name: Upload Native Binaries (.a)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-ios-${{ matrix.sdk }}-${{ matrix.arch }}
          path: artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}/*

      - name: Upload C# Bindings Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-csharp-ios-${{ matrix.sdk }}-${{ matrix.arch }}-bindings
          path: assimp-csharp-ios-${{ matrix.sdk }}-${{ matrix.arch }}-bindings.zip

  maccatalyst:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    needs: [changes]
    name: MacCatalyst
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            min_version: "17.0" 

    steps:
      - name: Cache Assimp Submodule
        uses: actions/cache@v5
        id: cache
        with:
          path: |
            artifacts/maccatalyst/${{ matrix.arch }}/
            assimp-csharp-maccatalyst-${{ matrix.arch }}-bindings.zip
          key: ${{ runner.os }}-assimp-${{ github.ref_name }}-${{ env.ASSIMP_VERSION }}

      - name: Checkout Repository with Submodules
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
 
      - name: Install SWIG and Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install cmake

      - name: Install supported SWIG
        uses: mmomtchev/setup-swig@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          version: v4.3.0

      - name: Build Mac Catalyst native library and C# bindings
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/assimp-maccatalyst.sh --ci -arm64

      - name: Compress Generated C# Classes
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd src/Assimp.Maui/Platforms/MacCatalyst/Maui
          zip -r "$GITHUB_WORKSPACE/assimp-csharp-maccatalyst-${{ matrix.arch }}-bindings.zip" . -x "assimpmaui.cxx" "assimpmaui.o"

      - name: Prepare Mac Catalyst Artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p artifacts/maccatalyst/${{ matrix.arch }}
          cp build/maccatalyst-${{ matrix.arch }}/lib/libassimp.a artifacts/maccatalyst/${{ matrix.arch }}/
          cp build/maccatalyst-${{ matrix.arch }}/lib/libassimpmaui.a artifacts/maccatalyst/${{ matrix.arch }}/
          libtool -static -o artifacts/maccatalyst/${{ matrix.arch }}/libassimp.a \
            artifacts/maccatalyst/${{ matrix.arch }}/libassimp.a \
            artifacts/maccatalyst/${{ matrix.arch }}/libassimpmaui.a
          rm -f artifacts/maccatalyst/${{ matrix.arch }}/libassimpmaui.a
          
      - name: Upload Native Binaries (.a)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-maccatalyst-${{ matrix.arch }}
          path: artifacts/maccatalyst/${{ matrix.arch }}/*

      - name: Upload C# Bindings Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-csharp-maccatalyst-${{ matrix.arch }}-bindings
          path: assimp-csharp-maccatalyst-${{ matrix.arch }}-bindings.zip

  windows:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    needs: [changes]
    name: Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            generator_arch: x64
          - arch: arm64
            generator_arch: ARM64

    steps:
      - name: Cache Assimp Built lib
        uses: actions/cache@v5
        id: cache
        with:
          path: |
            assimp-csharp-windows-${{ matrix.arch }}-bindings.zip
            artifacts/windows/${{ matrix.arch }}/
          key: ${{ runner.os }}-assimp-${{ github.ref_name }}-${{ env.ASSIMP_VERSION }}
      
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install supported SWIG
        uses: mmomtchev/setup-swig@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          version: v4.3.0

      - name: Build Windows native library and C# bindings
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:ASSIMP_TAG = 'v${{ env.ASSIMP_VERSION }}'
          & .\scripts\assimp-windows.ps1 -Arch '${{ matrix.arch }}' -NoPublishLocal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compress Generated C# Classes
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          Compress-Archive -Path src/Assimp.Maui/Platforms/Windows/Maui/*.cs -DestinationPath assimp-csharp-windows-${{ matrix.arch }}-bindings.zip

      - name: Prepare Windows Artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows/${{ matrix.arch }}
          Copy-Item build/windows-${{ matrix.arch }}/bin/Release/*.dll artifacts/windows/${{ matrix.arch }}/

      - name: Upload Native Binaries (.dll)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-windows-${{ matrix.arch }}
          path: artifacts/windows/${{ matrix.arch }}/*.dll

      - name: Upload C# Bindings Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-csharp-windows-${{ matrix.arch }}-bindings
          path: assimp-csharp-windows-${{ matrix.arch }}-bindings.zip

  synchronize-swig-sources:
    name: Synchronize generated SWIG sources
    runs-on: ubuntu-latest
    needs: [android, ios, maccatalyst, windows]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      
      - name: Download Android c# bindings
        uses: actions/download-artifact@v8
        with:
          name: assimp-csharp-android-arm64-v8a-bindings
          path: ${{ github.workspace }}/artifacts/android-bindings

      - name: Extract Android c# bindings
        run: unzip -o ${{ github.workspace }}/artifacts/android-bindings/assimp-csharp-android-arm64-v8a-bindings.zip -d ${{ github.workspace }}/artifacts/android-bindings
      
      - name: Download iOS c# bindings
        uses: actions/download-artifact@v8
        with:
          name: assimp-csharp-ios-iphonesimulator-arm64-bindings
          path: ${{ github.workspace }}/artifacts/

      - name: Extract iOS Bindings
        run: unzip -o ${{ github.workspace }}/artifacts/assimp-csharp-ios-iphonesimulator-arm64-bindings.zip -d ${{ github.workspace }}/artifacts/ios-bindings

      - name: Download Mac c# bindings
        uses: actions/download-artifact@v8
        with:
          name: assimp-csharp-maccatalyst-arm64-bindings
          path: ${{ github.workspace }}/artifacts/
     
      - name: Extract Mac c# Bindings
        run: unzip -o ${{ github.workspace }}/artifacts/assimp-csharp-maccatalyst-arm64-bindings.zip -d ${{ github.workspace }}/artifacts/mac-bindings


      - name: Download Windows c# bindings
        uses: actions/download-artifact@v8
        with:
          name: assimp-csharp-windows-arm64-bindings
          path: ${{ github.workspace }}/artifacts/

      - name: Extract Windows c# Bindings
        run: unzip -o ${{ github.workspace }}/artifacts/assimp-csharp-windows-arm64-bindings.zip -d ${{ github.workspace }}/artifacts/win-bindings          
    
      - name: Inspect artifacts
        run: ls -R ${{ github.workspace }}/artifacts
        
      - name: Prepare Dirs
        run: |
          mkdir -p ${{ github.workspace }}/src/Assimp.Maui/Platforms/Android/Maui
          mkdir -p ${{ github.workspace }}/src/Assimp.Maui/Platforms/iOS/Maui
          mkdir -p ${{ github.workspace }}/src/Assimp.Maui/Platforms/MacCatalyst/Maui
          mkdir -p ${{ github.workspace }}/src/Assimp.Maui/Platforms/Windows/Maui

          cp -v ${{ github.workspace }}/artifacts/android-bindings/*.cs ${{ github.workspace }}/src/Assimp.Maui/Platforms/Android/Maui/
          cp -v ${{ github.workspace }}/artifacts/ios-bindings/*.cs ${{ github.workspace }}/src/Assimp.Maui/Platforms/iOS/Maui/
          cp -v ${{ github.workspace }}/artifacts/mac-bindings/*.cs ${{ github.workspace }}/src/Assimp.Maui/Platforms/MacCatalyst/Maui/
          cp -v ${{ github.workspace }}/artifacts/win-bindings/*.cs ${{ github.workspace }}/src/Assimp.Maui/Platforms/Windows/Maui/

      - name: Synchronize generated SWIG sources
        shell: bash
        run: |
            set -e
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "Adding generated C# files..."
            git add \
              src/Assimp.Maui/Platforms/Android/Maui/* \
              src/Assimp.Maui/Platforms/iOS/Maui/* \
              src/Assimp.Maui/Platforms/MacCatalyst/Maui/* \
              src/Assimp.Maui/Platforms/Windows/Maui/*
            if git diff --cached --quiet; then
              echo "No generated sources changed."
            else
              git commit -m "feat: Update generated SWIG bindings"
              git push origin HEAD:${{ github.head_ref }}
              echo "Generated bindings committed successfully."
              exit 0
            fi
  
  nupkg:
    runs-on: windows-latest
    name: Assimp.Maui.nupkg
    needs: [android, ios, maccatalyst, windows]
    permissions:
      id-token: write
      contents: write
      packages: write
      actions: read

    steps: 
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set VERSION variable
        shell: bash
        run: |
          CSPROJ_PATH="${{ github.workspace }}/src/Assimp.Maui/build/Assimp.Maui.targets"
          
          VERSION=$(xmllint --xpath "//*[local-name()='LibVersion']/text()" "$CSPROJ_PATH" 2>/dev/null | xargs)
          
          if [ -n "$VERSION" ]; then
            echo "Found version: $VERSION"
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          else
            echo "Error: Tag <Version> not found at .csproj file"
            exit 1
          fi

      - name: Cache assimp Built SDK
        uses: actions/cache@v5
        id: cache-libs
        with:
          path: ${{ github.workspace }}/nupkg/*.nupkg
          key: Assimp.Maui.${{ env.VERSION }}.nupkg-${{ env.ASSIMP_VERSION }}
        env: 
          VERSION: ${{ env.VERSION }}

      - name: Setup .NET 11
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          
      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'
        if: steps.cache-libs.outputs.cache-hit != 'true'
          
      - name: Download Android c# bindings
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-csharp-android-arm64-v8a-bindings
          path: ${{ github.workspace }}/artifacts/
 
      - name: Extract Android Bindings
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          unzip -o ./artifacts/assimp-csharp-android-arm64-v8a-bindings.zip -d ./artifacts/android-bindings

      - name: Download native Android x86
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-android-x86
          path: ${{ github.workspace }}/artifacts/assimp-android-x86

      - name: Download native Android x86_64
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-android-x86_64
          path: ${{ github.workspace }}/artifacts/assimp-android-x86_64

      - name: Download native Android armeabi-v7a
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-android-armeabi-v7a
          path: ${{ github.workspace }}/artifacts/assimp-android-armeabi-v7a

      - name: Download native Android arm64-v8a
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-android-arm64-v8a
          path: ${{ github.workspace }}/artifacts/assimp-android-arm64-v8a
          
      - name: Download iOS c# bindings
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-csharp-ios-iphonesimulator-arm64-bindings
          path: ./artifacts/

      - name: Extract iOS Bindings
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          unzip -o ./artifacts/assimp-csharp-ios-iphonesimulator-arm64-bindings.zip -d ./artifacts/ios-bindings
      - name: Download native iOS arm64 iphoneos
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-ios-iphoneos-arm64
          path: ${{ github.workspace }}/artifacts/assimp-ios-iphoneos-arm64

      - name: Download native iOS arm64 iphonesimulator
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-ios-iphonesimulator-arm64
          path: ${{ github.workspace }}/artifacts/assimp-ios-iphonesimulator-arm64

      - name: Download Mac c# bindings
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-csharp-maccatalyst-arm64-bindings
          path: ${{ github.workspace }}/artifacts/
     
      - name: Extract Mac c# Bindings
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          unzip -o ./artifacts/assimp-csharp-maccatalyst-arm64-bindings.zip -d ./artifacts/mac-bindings

      - name: Download native Mac arm64
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-maccatalyst-arm64
          path: ${{ github.workspace }}/artifacts/assimp-maccatalyst-arm64

      - name: Download Windows c# bindings
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-csharp-windows-arm64-bindings
          path: ${{ github.workspace }}/artifacts/

      - name: Extract Windows c# Bindings
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          unzip -o ./artifacts/assimp-csharp-windows-arm64-bindings.zip -d ./artifacts/win-bindings          
      - name: Download native Windows arm64
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-windows-arm64
          path: ${{ github.workspace }}/artifacts/assimp-windows-arm64

      - name: Download native Windows x64
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-windows-x64
          path: ${{ github.workspace }}/artifacts/assimp-windows-x64
      - name: Validate artifacts
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ls -R ./artifacts/
    
      - name: Prepare Dirs
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ./src/Assimp.Maui/Platforms/Android/Maui
          mkdir -p ./src/Assimp.Maui/Platforms/iOS/Maui
          mkdir -p ./src/Assimp.Maui/Platforms/MacCatalyst/Maui
          mkdir -p ./src/Assimp.Maui/Platforms/Windows/Maui
          mkdir -p ./src/Assimp.Maui/Platforms/Android/runtimes/android-arm/native
          mkdir -p ./src/Assimp.Maui/Platforms/Android/runtimes/android-arm64/native
          mkdir -p ./src/Assimp.Maui/Platforms/Android/runtimes/android-x86/native
          mkdir -p ./src/Assimp.Maui/Platforms/Android/runtimes/android-x86_64/native
          mkdir -p ./src/Assimp.Maui/Platforms/iOS/runtimes/ios-arm64/native
          mkdir -p ./src/Assimp.Maui/Platforms/iOS/runtimes/iossimulator-arm64/native 
          mkdir -p ./src/Assimp.Maui/Platforms/MacCatalyst/runtimes/maccatalyst-arm64/native 
          mkdir -p ./src/Assimp.Maui/Platforms/Windows/runtimes/win-arm64/native
          mkdir -p ./src/Assimp.Maui/Platforms/Windows/runtimes/win-x64/native
          cp -v ./artifacts/android-bindings/*.cs ./src/Assimp.Maui/Platforms/Android/Maui/
          cp -v ./artifacts/ios-bindings/*.cs ./src/Assimp.Maui/Platforms/iOS/Maui/
          cp -v ./artifacts/mac-bindings/*.cs ./src/Assimp.Maui/Platforms/MacCatalyst/Maui/
          cp -v ./artifacts/win-bindings/*.cs ./src/Assimp.Maui/Platforms/Windows/Maui/
          mv -v ./artifacts/assimp-android-armeabi-v7a/*.* ./src/Assimp.Maui/Platforms/Android/runtimes/android-arm/native
          mv -v ./artifacts/assimp-android-arm64-v8a/*.* ./src/Assimp.Maui/Platforms/Android/runtimes/android-arm64/native
          mv -v ./artifacts/assimp-android-x86/*.* ./src/Assimp.Maui/Platforms/Android/runtimes/android-x86/native
          mv -v ./artifacts/assimp-android-x86_64/*.* ./src/Assimp.Maui/Platforms/Android/runtimes/android-x86_64/native
          mv -v ./artifacts/assimp-ios-iphoneos-arm64/*.* ./src/Assimp.Maui/Platforms/iOS/runtimes/ios-arm64/native
          mv -v ./artifacts/assimp-ios-iphonesimulator-arm64/*.* ./src/Assimp.Maui/Platforms/iOS/runtimes/iossimulator-arm64/native
          mv -v ./artifacts/assimp-maccatalyst-arm64/*.* ./src/Assimp.Maui/Platforms/MacCatalyst/runtimes/maccatalyst-arm64/native 
          mv -v ./artifacts/assimp-windows-arm64/*.* ./src/Assimp.Maui/Platforms/Windows/runtimes/win-arm64/native
          mv -v ./artifacts/assimp-windows-x64/*.* ./src/Assimp.Maui/Platforms/Windows/runtimes/win-x64/native

      - name: Inspect artifacts
        shell: bash
        run: ls -R ./src/Assimp.Maui/Platforms/
          
      - name: Restore Dependencies
        working-directory: src
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: bash
        run: | 
          echo "⏳ Installing required workloads for .NET 10..."
          dotnet workload install android ios maccatalyst --source https://api.nuget.org/v3/index.json --skip-manifest-update

          echo "⏳ Updating and synchronizing workloads..."
          dotnet workload update
          
          if [ -f "$(find .. -name "*.slnx" -o -name "*.sln" | head -n 1)" ]; then
            echo "📦 Restoring entire solution..."
            dotnet workload restore $(find .. -name "Assimp.MAUI.slnx" | head -n 1)
          fi

          echo "📦 Forcing clean NuGet restore for all target projects..."
          dotnet restore Assimp.Maui/Assimp.Maui.csproj

      - name: Pack NuGet Package
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: bash
        run: dotnet pack ./src/Assimp.Maui/Assimp.Maui.csproj -c Release  -o ./nupkg "-p:IsOfficialBuild=true"
      
      - name: NuGet login (OIDC) and package push
        id: login 
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        with:
          user: ${{ env.USERNAME }}  
        env:
          USERNAME: ${{ secrets.USERNAME }}

      - uses: actions/upload-artifact@v7
        if: steps.cache-libs.outputs.cache-hit != 'true'
        name: Upload NuGet packages
        with:
          name: Assimp.Maui.${{ env.VERSION }}
          path: |
            ${{ github.workspace }}/nupkg/*.nupkg
            ${{ github.workspace }}/nupkg/*.snupkg
        env: 
          VERSION: ${{ env.VERSION }}

      - name: Push to NuGet.org (OIDC / Key)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ./nupkg/
        shell: bash
        run: |
          dotnet nuget push ./*pkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env: 
          VERSION: ${{ env.VERSION }}

