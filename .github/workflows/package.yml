name: Package Assimp

on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: ["opened", "synchronize"]
    paths:
      - '.github/workflows/package.yml'
      - 'external/assimp'
      - 'external/assimp/**'
      - 'sample/**'
  workflow_dispatch:

env:
  ASSIMP_VERSION: '6.0.5'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
      sample: ${{ steps.filter.outputs.sample }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - '.github/workflows/package.yml'
              - 'external/assimp'
              - 'external/assimp/**'
            sample:
              - 'sample/**'

  android:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    needs: [changes]
    name: Android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            arch_name: arm
          - abi: arm64-v8a
            arch_name: arm64
          - abi: x86
            arch_name: x86
          - abi: x86_64
            arch_name: x64

    steps:
        
      - name: Cache Assimp Submodule
        uses: actions/cache@v5
        id: cache
        with:
          path: |
            artifacts/android/${{ matrix.abi }}/
            assimp-csharp-android-${{ matrix.abi }}-bindings.zip
          key: ${{ runner.os }}-assimp-${{ github.ref_name }}-${{ env.ASSIMP_VERSION }}
                  
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y swig cmake build-essential zip

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Configure CMake for Android (${{ matrix.abi }})
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S external/assimp -B build/android-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_C_FLAGS="-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64 -Wno-implicit-function-declaration -Wno-error=implicit-function-declaration" \
            -DCMAKE_CXX_FLAGS="-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64" \
            -DASSIMP_BUILD_TESTS=OFF \
            -DASSIMP_BUILD_ASSIMP_TOOLS=OFF \
            -DASSIMP_BUILD_ZLIB=ON \
            -DASSIMP_INSTALL_PDB=OFF \
            -DASSIMP_INJECT_DEBUG_POSTFIX=OFF

      - name: Build Assimp Shared Library
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake --build build/android-${{ matrix.abi }} --config Release -j $(nproc)

      - name: Generate SWIG C# Bindings for Android
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p swig_output/android
          swig -c++ -csharp \
            -namespace Assimp.Maui \
            -dllimport assimpmaui \
            -outdir swig_output/android \
            -o swig_output/android/assimpmaui.cxx \
            swig/assimp.i

      - name: Build Native SWIG Wrapper (.so)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          case "${{ matrix.abi }}" in
            "armeabi-v7a")
              HOST_TRIPLET="armv7a-linux-androideabi24"
              ;;
            "arm64-v8a")
              HOST_TRIPLET="aarch64-linux-android24"
              ;;
            "x86")
              HOST_TRIPLET="i686-linux-android24"
              ;;
            "x86_64")
              HOST_TRIPLET="x86_64-linux-android24"
              ;;
          esac

          NDK_CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${HOST_TRIPLET}-clang++"

          $NDK_CLANG -shared -fPIC -O3 \
            swig_output/android/assimpmaui.cxx \
            -Iexternal/assimp/include \
            -Ibuild/android-${{ matrix.abi }}/include \
            -Lbuild/android-${{ matrix.abi }}/bin \
            -Lbuild/android-${{ matrix.abi }}/lib \
            -lassimp \
            -o build/android-${{ matrix.abi }}/bin/libassimpmaui.so

      - name: Compress Generated C# Classes
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd swig_output/android
          zip -r ../../assimp-csharp-android-${{ matrix.abi }}-bindings.zip . -x "assimpmaui.cxx"

      - name: Prepare Android Artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p artifacts/android/${{ matrix.abi }}
          cp build/android-${{ matrix.abi }}/bin/libassimp.so artifacts/android/${{ matrix.abi }}/
          cp build/android-${{ matrix.abi }}/bin/libassimpmaui.so artifacts/android/${{ matrix.abi }}/

      - name: Upload Native Binaries (.so)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-android-${{ matrix.abi }}
          path: artifacts/android/${{ matrix.abi }}/*

      - name: Upload C# Bindings Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-csharp-android-${{ matrix.abi }}-bindings
          path: assimp-csharp-android-${{ matrix.abi }}-bindings.zip

  ios:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    needs: [changes]
    name: iOS
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: device
            sdk: iphoneos
            arch: arm64
            min_version: "14.0"
          - target: simulator
            sdk: iphonesimulator
            arch: arm64
            min_version: "14.0"
          - target: simulator
            sdk: iphonesimulator
            arch: x86_64
            min_version: "14.0"

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Assimp Submodule
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            assimp-csharp-ios-${{ matrix.sdk }}-${{ matrix.arch }}-bindings.zip
            artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}/
          key: ${{ runner.os }}-assimp-${{ github.ref_name }}-${{ env.ASSIMP_VERSION }}
        
      - name: Setup Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        if: steps.cache.outputs.cache-hit != 'true'
      
        with:
          xcode-version: '26.3'

      - name: Install SWIG and Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install swig cmake

      - name: Configure CMake for iOS (${{ matrix.sdk }} - ${{ matrix.arch }})
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/ios-${{ matrix.sdk }}-${{ matrix.arch }}
          cmake -S external/assimp -B build/ios-${{ matrix.sdk }}-${{ matrix.arch }} \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.min_version }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DASSIMP_BUILD_TESTS=OFF \
            -DASSIMP_BUILD_ASSIMP_TOOLS=OFF \
            -DASSIMP_BUILD_ZLIB=OFF \
            -DASSIMP_INSTALL_PDB=OFF \
            -DASSIMP_INJECT_DEBUG_POSTFIX=OFF

      - name: Build Assimp Static Library
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake --build build/ios-${{ matrix.sdk }}-${{ matrix.arch }} --config Release -j $(sysctl -n hw.ncpu)

      - name: Generate SWIG C# Bindings for iOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p swig_output/ios
          swig -c++ -csharp \
            -namespace Assimp.Maui \
            -dllimport __Internal \
            -outdir swig_output/ios \
            -o swig_output/ios/assimpmaui.cxx \
            swig/assimp.i

      - name: Build Native SWIG Static Wrapper (.a)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ matrix.sdk }}" = "iphoneos" ]; then
            SDK_FLAG="-miphoneos-version-min=${{ matrix.min_version }}"
          else
            SDK_FLAG="-mios-simulator-version-min=${{ matrix.min_version }}"
          fi

          xcrun -sdk ${{ matrix.sdk }} clang++ -c -O3 \
            -arch ${{ matrix.arch }} \
            $SDK_FLAG \
            swig_output/ios/assimpmaui.cxx \
            -Iexternal/assimp/include \
            -Ibuild/ios-${{ matrix.sdk }}-${{ matrix.arch }}/include \
            -o build/ios-${{ matrix.sdk }}-${{ matrix.arch }}/lib/assimpmaui.o
          
          ar rcs build/ios-${{ matrix.sdk }}-${{ matrix.arch }}/lib/libassimpmaui.a \
            build/ios-${{ matrix.sdk }}-${{ matrix.arch }}/lib/assimpmaui.o

      - name: Compress Generated C# Classes
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd swig_output/ios
          zip -r ../../assimp-csharp-ios-${{ matrix.sdk }}-${{ matrix.arch }}-bindings.zip . -x "assimpmaui.cxx" "assimpmaui.o"

      - name: Prepare iOS Artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}
          cp build/ios-${{ matrix.sdk }}-${{ matrix.arch }}/lib/libassimp.a artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}/
          cp build/ios-${{ matrix.sdk }}-${{ matrix.arch }}/lib/libassimpmaui.a artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}/

      - name: Upload Native Binaries (.a)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-ios-${{ matrix.sdk }}-${{ matrix.arch }}
          path: artifacts/ios/${{ matrix.sdk }}-${{ matrix.arch }}/*

      - name: Upload C# Bindings Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-csharp-ios-${{ matrix.sdk }}-${{ matrix.arch }}-bindings
          path: assimp-csharp-ios-${{ matrix.sdk }}-${{ matrix.arch }}-bindings.zip

  maccatalyst:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    needs: [changes]
    name: MacCatalyst
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            min_version: "14.0"
          - arch: x86_64
            min_version: "14.0"

    steps:
      - name: Cache Assimp Submodule
        uses: actions/cache@v5
        id: cache
        with:
          path: |
            artifacts/maccatalyst/${{ matrix.arch }}/
            assimp-csharp-maccatalyst-${{ matrix.arch }}-bindings.zip
          key: ${{ runner.os }}-assimp-${{ github.ref_name }}-${{ env.ASSIMP_VERSION }}

      - name: Checkout Repository with Submodules
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

     
      - name: Setup Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          xcode-version: '26.3'

      - name: Install SWIG and Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install swig cmake

      - name: Configure CMake for Mac Catalyst (${{ matrix.arch }})
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/maccatalyst-${{ matrix.arch }}
          cmake -S external/assimp -B build/maccatalyst-${{ matrix.arch }} \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_OSX_SYSROOT=macosx \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_C_FLAGS="-target ${{ matrix.arch }}-apple-ios${{ matrix.min_version }}-macabi" \
            -DCMAKE_CXX_FLAGS="-target ${{ matrix.arch }}-apple-ios${{ matrix.min_version }}-macabi" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DASSIMP_BUILD_TESTS=OFF \
            -DASSIMP_BUILD_ASSIMP_TOOLS=OFF \
            -DASSIMP_BUILD_ZLIB=OFF \
            -DASSIMP_INSTALL_PDB=OFF \
            -DASSIMP_INJECT_DEBUG_POSTFIX=OFF

      - name: Build Assimp Static Library (.a)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake --build build/maccatalyst-${{ matrix.arch }} --config Release -j $(sysctl -n hw.ncpu)

      - name: Generate SWIG C# Bindings for Mac Catalyst
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p swig_output/maccatalyst
          swig -c++ -csharp \
            -namespace Assimp.Maui \
            -dllimport __Internal \
            -outdir swig_output/maccatalyst \
            -o swig_output/maccatalyst/assimpmaui.cxx \
            swig/assimp.i

      - name: Build Native SWIG Static Wrapper (.a)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          xcrun -sdk macosx clang++ -c -O3 \
            -target ${{ matrix.arch }}-apple-ios${{ matrix.min_version }}-macabi \
            swig_output/maccatalyst/assimpmaui.cxx \
            -Iexternal/assimp/include \
            -Ibuild/maccatalyst-${{ matrix.arch }}/include \
            -o build/maccatalyst-${{ matrix.arch }}/lib/assimpmaui.o
          
          ar rcs build/maccatalyst-${{ matrix.arch }}/lib/libassimpmaui.a \
            build/maccatalyst-${{ matrix.arch }}/lib/assimpmaui.o

      - name: Compress Generated C# Classes
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd swig_output/maccatalyst
          zip -r ../../assimp-csharp-maccatalyst-${{ matrix.arch }}-bindings.zip . -x "assimpmaui.cxx" "assimpmaui.o"

      - name: Prepare Mac Catalyst Artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p artifacts/maccatalyst/${{ matrix.arch }}
          cp build/maccatalyst-${{ matrix.arch }}/lib/libassimp.a artifacts/maccatalyst/${{ matrix.arch }}/
          cp build/maccatalyst-${{ matrix.arch }}/lib/libassimpmaui.a artifacts/maccatalyst/${{ matrix.arch }}/

      - name: Upload Native Binaries (.a)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-maccatalyst-${{ matrix.arch }}
          path: artifacts/maccatalyst/${{ matrix.arch }}/*

      - name: Upload C# Bindings Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-csharp-maccatalyst-${{ matrix.arch }}-bindings
          path: assimp-csharp-maccatalyst-${{ matrix.arch }}-bindings.zip

  windows:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    needs: [changes]
    name: Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            generator_arch: x64
          - arch: arm64
            generator_arch: ARM64

    steps:
      - name: Cache Assimp Built lib
        uses: actions/cache@v5
        id: cache
        with:
          path: |
            assimp-csharp-windows-${{ matrix.arch }}-bindings.zip
            artifacts/windows/${{ matrix.arch }}/
          key: ${{ runner.os }}-assimp-${{ github.ref_name }}-${{ env.ASSIMP_VERSION }}
      
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install SWIG via Chocolatey
        if: steps.cache.outputs.cache-hit != 'true'      
        run: |
          choco install swig -y

      - name: Configure CMake for Windows (${{ matrix.arch }})
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S external/assimp -B build/windows-${{ matrix.arch }} `
            -G "Visual Studio 17 2022" `
            -A ${{ matrix.generator_arch }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DASSIMP_BUILD_TESTS=OFF `
            -DASSIMP_BUILD_ASSIMP_TOOLS=OFF `
            -DASSIMP_BUILD_ZLIB=ON `
            -DASSIMP_INSTALL_PDB=OFF `
            -DASSIMP_INJECT_DEBUG_POSTFIX=OFF

      - name: Build Assimp DLL
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake --build build/windows-${{ matrix.arch }} --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Generate SWIG C# Bindings for Windows
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path swig_output/windows
          swig -c++ -csharp `
            -namespace Assimp.Maui `
            -dllimport assimpmaui `
            -outdir swig_output/windows `
            -o swig_output/windows/assimpmaui.cxx `
            swig/assimp.i

      - name: Build Native SWIG Wrapper DLL
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          :: Define a arquitetura do toolchain cruzado (x64_arm64 para buildar ARM64 a partir do runner x64)
          if "${{ matrix.arch }}" == "arm64" ( set VCVARS_ARCH=x64_arm64 ) else ( set VCVARS_ARCH=x64 )
          
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" %VCVARS_ARCH%
          
          :: A flag /std:c++17 resolve o erro C7525 do defs.h do Assimp
          cl /LD /EHsc /O2 /std:c++17 ^
            swig_output\windows\assimpmaui.cxx ^
            /Iexternal\assimp\include ^
            /Ibuild\windows-${{ matrix.arch }}\include ^
            /link /LIBPATH:build\windows-${{ matrix.arch }}\lib\Release assimp-vc143-mt.lib ^
            /OUT:build\windows-${{ matrix.arch }}\bin\Release\assimpmaui.dll

      - name: Compress Generated C# Classes
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          Compress-Archive -Path swig_output/windows/*.cs -DestinationPath assimp-csharp-windows-${{ matrix.arch }}-bindings.zip

      - name: Prepare Windows Artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows/${{ matrix.arch }}
          Copy-Item build/windows-${{ matrix.arch }}/bin/Release/*.dll artifacts/windows/${{ matrix.arch }}/

      - name: Upload Native Binaries (.dll)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-windows-${{ matrix.arch }}
          path: artifacts/windows/${{ matrix.arch }}/*.dll

      - name: Upload C# Bindings Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: assimp-csharp-windows-${{ matrix.arch }}-bindings
          path: assimp-csharp-windows-${{ matrix.arch }}-bindings.zip


  synchronize-swig-sources:
    name: Synchronize generated SWIG sources
    runs-on: ubuntu-latest
    needs: [android, ios, maccatalyst, windows]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      
      - name: Download Android c# bindings
        uses: actions/download-artifact@v8
        with:
          name: assimp-csharp-android-arm64-v8a-bindings
          path: ${{ github.workspace }}/artifacts/android-bindings
      
      - name: Download iOS c# bindings
        uses: actions/download-artifact@v8
        with:
          name: assimp-csharp-ios-iphonesimulator-arm64-bindings
          path: ${{ github.workspace }}/artifacts/ios-bindings
    
      - name: Download Mac c# bindings
        uses: actions/download-artifact@v8
        with:
          name: assimp-csharp-maccatalyst-arm64-bindings
          path: ${{ github.workspace }}/artifacts/mac-bindings
     
      - name: Download Windows c# bindings
        uses: actions/download-artifact@v8
        with:
          name: assimp-csharp-windows-arm64-bindings
          path: ${{ github.workspace }}/artifacts/win-bindings
    
      - name: Prepare Dirs
        run: |
          mkdir -p ${{ github.workspace }}/src/Assimp.Maui.Android/Maui
          mkdir -p ${{ github.workspace }}/src/Assimp.Maui.iOS/Maui
          mkdir -p ${{ github.workspace }}/src/Assimp.Maui.MacCatalyst/Maui
          mkdir -p ${{ github.workspace }}/src/Assimp.Maui.Windows/Maui

          cp -v ${{ github.workspace }}/artifacts/android-bindings/*.cs ${{ github.workspace }}/src/Assimp.Maui.Android/Maui/
          cp -v ${{ github.workspace }}/artifacts/ios-bindings/*.cs ${{ github.workspace }}/src/Assimp.Maui.iOS/Maui/
          cp -v ${{ github.workspace }}/artifacts/mac-bindings/*.cs ${{ github.workspace }}/src/Assimp.Maui.MacCatalyst/Maui/
          cp -v ${{ github.workspace }}/artifacts/win-bindings/*.cs ${{ github.workspace }}/src/Assimp.Maui.Windows/Maui/

      - name: Synchronize generated SWIG sources
        shell: bash
        run: |
            set -e
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "Adding generated C# files..."
            git add \
              src/Assimp.Maui.Android/Maui/* \
              src/Assimp.Maui.iOS/Maui/* \
              src/Assimp.Maui.MacCatalyst/Maui/* \
              src/Assimp.Maui.Windows/Maui/*
            if git diff --cached --quiet; then
              echo "No generated sources changed."
            else
              git commit -m "feat: Update generated SWIG bindings"
              git push origin HEAD:${{ github.head_ref }}
              echo "Generated bindings committed successfully."
              exit 0
            fi
  
  nupkg:
    runs-on: macos-26
    name: Assimp.Maui.nupkg
    needs: [android, ios, maccatalyst, windows]
    permissions:
      id-token: write
      contents: write
      packages: write
      actions: read

    steps: 
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set VERSION variable
        run: |
          NUSPEC_PATH="${{ github.workspace }}/src/Assimp.Maui.nuspec"
          
          VERSION=$(xmllint --xpath "//*[local-name()='version']/text()" "$NUSPEC_PATH" 2>/dev/null | xargs)
          
          if [ -n "$VERSION" ]; then
            echo "Found version: $VERSION"
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          else
            echo "Error: Tag <version> not found at .nuspec file"
            exit 1
          fi

      - name: Cache assimp Built SDK
        uses: actions/cache@v5
        id: cache-libs
        with:
          path: ${{ github.workspace }}/src/*.nupkg
          key: Assimp.Maui.${{ env.VERSION }}.nupkg-${{ env.ASSIMP_VERSION }}
        env: 
          VERSION: ${{ env.VERSION }}

      - name: Setup .NET 10
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          
      - name: Setup nuget 
        run: brew install nuget
        if: steps.cache-libs.outputs.cache-hit != 'true'
 
      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'
        if: steps.cache-libs.outputs.cache-hit != 'true'
          
      - name: Download Android c# bindings
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-csharp-android-arm64-v8a-bindings
          path: ${{ github.workspace }}/artifacts/

      - name: Extract Android Bindings
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          unzip -o ${{ github.workspace }}/artifacts/assimp-csharp-android-arm64-v8a-bindings.zip -d ${{ github.workspace }}/artifacts/android-bindings

      - name: Download native Android x86
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-android-x86
          path: ${{ github.workspace }}/artifacts/assimp-android-x86

      - name: Download native Android x86_64
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-android-x86_64
          path: ${{ github.workspace }}/artifacts/assimp-android-x86_64

      - name: Download native Android armeabi-v7a
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-android-armeabi-v7a
          path: ${{ github.workspace }}/artifacts/assimp-android-armeabi-v7a

      - name: Download native Android arm64-v8a
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-android-arm64-v8a
          path: ${{ github.workspace }}/artifacts/assimp-android-arm64-v8a

      - name: Download iOS c# bindings
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-csharp-ios-iphonesimulator-arm64-bindings
          path: ${{ github.workspace }}/artifacts/

      - name: Extract iOS Bindings
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          unzip -o ${{ github.workspace }}/artifacts/assimp-csharp-ios-iphonesimulator-arm64-bindings.zip -d ${{ github.workspace }}/artifacts/ios-bindings
      - name: Download native iOS arm64 iphoneos
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-ios-iphoneos-arm64
          path: ${{ github.workspace }}/artifacts/assimp-ios-iphoneos-arm64

      - name: Download native iOS arm64 iphonesimulator
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-ios-iphonesimulator-arm64
          path: ${{ github.workspace }}/artifacts/assimp-ios-iphonesimulator-arm64

      - name: Download native iOS x86_64 iphonesimulator 
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-ios-iphonesimulator-x86_64
          path: ${{ github.workspace }}/artifacts/assimp-ios-iphonesimulator-x86_64
    
      - name: Download Mac c# bindings
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-csharp-maccatalyst-arm64-bindings
          path: ${{ github.workspace }}/artifacts/
     
      - name: Extract iOS Bindings
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          unzip -o ${{ github.workspace }}/artifacts/assimp-csharp-maccatalyst-arm64-bindings.zip -d ${{ github.workspace }}/artifacts/mac-bindings

      - name: Download native Mac arm64
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-maccatalyst-arm64
          path: ${{ github.workspace }}/artifacts/assimp-maccatalyst-arm64

      - name: Download native Mac x86_64
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-maccatalyst-x86_64
          path: ${{ github.workspace }}/artifacts/assimp-maccatalyst-x86_64

      - name: Download Windows c# bindings
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-csharp-windows-arm64-bindings
          path: ${{ github.workspace }}/artifacts/

      - name: Extract iOS Bindings
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          unzip -o ${{ github.workspace }}/artifacts/assimp-csharp-windows-arm64-bindings.zip -d ${{ github.workspace }}/artifacts/win-bindings          
      - name: Download native Windows arm64
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-windows-arm64
          path: ${{ github.workspace }}/artifacts/assimp-windows-arm64

      - name: Download native Windows x64
        uses: actions/download-artifact@v8
        if: steps.cache-libs.outputs.cache-hit != 'true'
        with:
          name: assimp-windows-x64
          path: ${{ github.workspace }}/artifacts/assimp-windows-x64
      - name: Validate artifacts
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          ls -R ${{ github.workspace }}/artifacts/
    
      - name: Prepare Dirs
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/src/Assimp.Maui.Android/Maui
          mkdir -p ${{ github.workspace }}/src/Assimp.Maui.iOS/Maui
          mkdir -p ${{ github.workspace }}/src/Assimp.Maui.MacCatalyst/Maui
          mkdir -p ${{ github.workspace }}/src/Assimp.Maui.Windows/Maui

          cp -v ${{ github.workspace }}/artifacts/android-bindings/*.cs ${{ github.workspace }}/src/Assimp.Maui.Android/Maui/
          cp -v ${{ github.workspace }}/artifacts/ios-bindings/*.cs ${{ github.workspace }}/src/Assimp.Maui.iOS/Maui/
          cp -v ${{ github.workspace }}/artifacts/mac-bindings/*.cs ${{ github.workspace }}/src/Assimp.Maui.MacCatalyst/Maui/
          cp -v ${{ github.workspace }}/artifacts/win-bindings/*.cs ${{ github.workspace }}/src/Assimp.Maui.Windows/Maui/

      - name: Libtool
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          cd ${{ github.workspace }}/artifacts/assimp-ios-iphoneos-arm64
          libtool -static -o ../libassimp.a libassimp.a libassimpmaui.a
          rm -rf libassimp.a libassimpmaui.a
          mv ../libassimp.a .
          cd ${{ github.workspace }}/artifacts/assimp-ios-iphonesimulator-arm64
          libtool -static -o ../libassimp.a libassimp.a libassimpmaui.a
          rm -rf libassimp.a libassimpmaui.a
          mv ../libassimp.a .
          cd ${{ github.workspace }}/artifacts/assimp-ios-iphonesimulator-x86_64
          libtool -static -o ../libassimp.a libassimp.a libassimpmaui.a
          rm -rf libassimp.a libassimpmaui.a
          mv ../libassimp.a .
          cd ${{ github.workspace }}/artifacts/assimp-maccatalyst-arm64
          libtool -static -o ../libassimp.a libassimp.a libassimpmaui.a
          rm -rf libassimp.a libassimpmaui.a
          mv ../libassimp.a .
          cd ${{ github.workspace }}/artifacts/assimp-maccatalyst-x86_64
          libtool -static -o ../libassimp.a libassimp.a libassimpmaui.a
          rm -rf libassimp.a libassimpmaui.a
          mv ../libassimp.a .
          
      - name: Restore Dependencies
        working-directory: src
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: | 
          echo "⏳ Installing required workloads for .NET 10..."
          dotnet workload install android ios maccatalyst --source https://api.nuget.org/v3/index.json --skip-manifest-update

          echo "⏳ Updating and synchronizing workloads..."
          dotnet workload update
          
          if [ -f "$(find .. -name "*.slnx" -o -name "*.sln" | head -n 1)" ]; then
            echo "📦 Restoring entire solution..."
            dotnet workload restore $(find .. -name "*.slnx" -o -name "*.sln" | head -n 1)
          fi

          echo "📦 Forcing clean NuGet restore for all target projects..."
          dotnet restore Assimp.Maui.Android/Assimp.Maui.Android.csproj
          dotnet restore Assimp.Maui.iOS/Assimp.Maui.iOS.csproj
          dotnet restore Assimp.Maui.MacCatalyst/Assimp.Maui.MacCatalyst.csproj
          dotnet restore Assimp.Maui.Windows/Assimp.Maui.Windows.csproj

      - name: Build MAUI Android
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: dotnet publish src/Assimp.Maui.Android/Assimp.Maui.Android.csproj -c Release -f net10.0-android -p:IsOfficialBuild=true --no-restore
        
      - name: Build MAUI iOS
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: dotnet publish src/Assimp.Maui.iOS/Assimp.Maui.iOS.csproj -c Release -f net10.0-ios -p:IsOfficialBuild=true --no-restore
      
      - name: Build MAUI MacOSX
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: dotnet publish src/Assimp.Maui.MacCatalyst/Assimp.Maui.MacCatalyst.csproj -c Release -f net10.0-maccatalyst -p:IsOfficialBuild=true --no-restore

      - name: Build MAUI Win
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: dotnet publish src/Assimp.Maui.Windows/Assimp.Maui.Windows.csproj -c Release -f net10.0-windows10.0.19041.0 -p:IsOfficialBuild=true --no-restore

      - name: NuGet login (OIDC) and package push
        id: login 
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        with:
          user: ${{ env.USERNAME }}  
        env:
          USERNAME: ${{ secrets.USERNAME }}

      - name: Pack NuGet Package
        if: steps.cache-libs.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/src
        run: |
          nuget pack Assimp.Maui.nuspec \
            -Version "${{ env.VERSION }}" \
            -BasePath "${{ github.workspace }}/src" \
            -NoPackageAnalysis \
            -NoDefaultExcludes \
            -Symbols \
            -SymbolPackageFormat snupkg
        env: 
          VERSION: ${{ env.VERSION }}
      
      - uses: actions/upload-artifact@v7
        if: steps.cache-libs.outputs.cache-hit != 'true'
        name: Upload NuGet packages
        with:
          name: Assimp.Maui.${{ env.VERSION }}
          path: |
            ${{ github.workspace }}/src/*.nupkg
            ${{ github.workspace }}/src/*.snupkg
        env: 
          VERSION: ${{ env.VERSION }}

      - name: Push to NuGet.org (OIDC / Key)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          dotnet nuget push ${{ github.workspace }}/src/Assimp.Maui.${{ env.VERSION }}.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env: 
          VERSION: ${{ env.VERSION }}

      - name: Push symbols to NuGet.org
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          dotnet nuget push \
            ${{ github.workspace }}/src/Assimp.Maui.${{ env.VERSION }}.snupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          VERSION: ${{ env.VERSION }}

      - name: Push to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          dotnet nuget push ${{ github.workspace }}/src/Assimp.Maui.${{ env.VERSION }}.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
        env: 
          VERSION: ${{ env.VERSION }}

  sample:
    if: github.event_name == 'pull_request' && needs.changes.outputs.sample == 'true'
    needs: [changes]
    name: Build sample
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: net10.0-android
            os: windows-latest
            runtime: win-x64
          - target: net10.0-ios
            os: macos-26
            runtime: iossimulator-arm64

          - target: net10.0-maccatalyst
            os: macos-26
            runtime: maccatalyst-arm64

          - target: net10.0-windows10.0.19041.0
            os: windows-latest
            runtime: android-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          
      - name: Setup Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        if: ${{ runner.os == 'macOS' }}
        with:
          xcode-version: '26.3'
      - uses: actions/setup-java@v5
        if: ${{ runner.os == 'Windows' }}
        with:
          distribution: 'microsoft'
          java-version: '17'
          
      - name: Build 
        working-directory: ${{ github.workspace }}/sample/Assimp.MAUI.Sample/
        run: dotnet build -c Release -f ${{  matrix.target }} -r ${{ matrix.runtime }}